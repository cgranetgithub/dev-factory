# Independent verification of every change reaching `main`.
#
# The factory runs the same four tools inside its own Docker container
# (`devfactory/verification/runner.py`), but that runner is part of the process being
# audited: it decides for itself whether its own output is acceptable. This
# workflow re-runs the checks on GitHub's infrastructure so the platform — not
# the pipeline — enforces the gate. Once it is a required status check on the
# `main` ruleset, "Verification passed" stops being a self-assertion.
#
# Keep the tool invocations below aligned with `devfactory/verification/runner.py`:
#   - Python 3.11 matches `docker/Dockerfile.test`
#   - bandit uses `-ll` (medium and above), matching the runner's pass rule,
#     which fails only on MEDIUM or HIGH findings
#   - mypy and pytest run over a copy of the checkout with the project installed,
#     as the runner's shared step does — a mypy that cannot resolve the project's
#     dependencies reports a different set of errors than one that can (issue #77)
# A divergence here means a PR can pass the factory's verification and fail CI,
# confusing rather than safe.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    # Every version the project claims to support, so the claim is a fact rather
    # than an intention. `requires-python` and the classifiers in pyproject.toml
    # must match this list — if a version has to be dropped here, drop the claim too.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit

      # Lint — configuration comes from pyproject.toml [tool.ruff].
      - name: ruff
        run: ruff check . --no-cache

      # Types — the verification step authority for this project.
      - name: mypy
        run: mypy . --ignore-missing-imports

      # Security — `-ll` reports MEDIUM and above; the accepted LOW findings are
      # documented in pyproject.toml and .bandit.
      - name: bandit
        run: bandit -r . -q -ll

      - name: pytest
        run: pytest -q

  # Single-version on purpose, unlike the job above: this exists to test the image
  # the factory actually uses, and that image is pinned to 3.11 by
  # docker/Dockerfile.test. A matrix here would test something the factory never runs.
  #
  # The factory runs its gate inside docker/Dockerfile.test, which is a thinner
  # environment than this runner: it has no git binary until we install one, no
  # git identity, and only the tools the image declares. A test that passes in the
  # `qa` job above can still fail to even *collect* in there — that divergence
  # silently blocked four factory runs before it was noticed. This job runs the
  # suite where the factory actually runs it.
  #
  # It runs mypy there too, over the same installed copy, for the same reason: it
  # is the check most sensitive to what is installed, and the gate and CI
  # disagreeing about types is exactly what blocked `main` in issue #77. If this
  # step and the runner ever drift, this job fails before the factory does.
  verification-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the verification image
        run: docker build -t devfactory-test:latest -f docker/Dockerfile.test .

      # Mirrors VerificationRunner._run_over_installed_copy: one copy at /build,
      # one install, then mypy and pytest over it. The `rm -rf build` is part of
      # the mirror, not housekeeping: setuptools builds in-tree, and the ./build/lib
      # it leaves behind makes mypy report a duplicate module instead of checking.
      - name: Type-check and test inside it, as the factory does
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace devfactory-test:latest sh -c '
            set -e   # without it the step would exit with pytest status alone, hiding mypy
            mkdir -p /build; cp -r /workspace/. /build/; cd /build
            pip install -q . || { echo "project install failed"; exit 1; }
            rm -rf build
            mypy . --ignore-missing-imports --cache-dir=/tmp/mypy_cache
            pytest --tb=short -q
          '
