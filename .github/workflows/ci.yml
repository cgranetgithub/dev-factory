# Independent verification of every change reaching `main`.
#
# The factory runs the same four tools inside its own Docker container
# (`devfactory/qa/runner.py`), but that runner is part of the process being
# audited: it decides for itself whether its own output is acceptable. This
# workflow re-runs the checks on GitHub's infrastructure so the platform — not
# the pipeline — enforces the gate. Once it is a required status check on the
# `main` ruleset, "Verification passed" stops being a self-assertion.
#
# Keep the tool invocations below aligned with `devfactory/qa/runner.py`:
#   - Python 3.11 matches `docker/Dockerfile.test`
#   - bandit uses `-ll` (medium and above), matching the runner's pass rule,
#     which fails only on MEDIUM or HIGH findings
# A divergence here means a PR can pass the factory's verification and fail CI,
# confusing rather than safe.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit

      # Lint — configuration comes from pyproject.toml [tool.ruff].
      - name: ruff
        run: ruff check . --no-cache

      # Types — the verification step authority for this project.
      - name: mypy
        run: mypy . --ignore-missing-imports

      # Security — `-ll` reports MEDIUM and above; the accepted LOW findings are
      # documented in pyproject.toml and .bandit.
      - name: bandit
        run: bandit -r . -q -ll

      - name: pytest
        run: pytest -q
